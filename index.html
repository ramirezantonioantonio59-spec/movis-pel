
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movis Pel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101018;
      color: white;
    }
    header {
      background: #191925;
      padding: 22px 16px;
      text-align: center;
      border-bottom: 2px solid #e63946;
    }
    header h1 {
      margin: 0;
      color: #ff4057;
      font-size: 34px;
    }
    header p { margin-bottom: 0; color: #ddd; }
    main { padding: 20px; max-width: 900px; margin: auto; }
    .bienvenida {
      text-align: center;
      padding: 28px 10px;
    }
    .bienvenida h2 { font-size: 27px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #222230;
      color: white;
      font-size: 16px;
    }
    .peliculas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }
    .pelicula {
      background: #20202d;
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 14px;
    }
    .poster {
      height: 150px;
      background: linear-gradient(135deg, #542344, #e63946);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
    }
    .pelicula h3 { padding: 0 12px; font-size: 17px; }
    .pelicula p { padding: 0 12px; color: #bbb; font-size: 14px; }
    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>MOVIS PEL</h1>
    <p>Tu cine, donde quieras</p>
  </header>

  <main>
    <section class="bienvenida">
      <h2>¡Bienvenido a Movis Pel!</h2>
      <p>Descubre películas para disfrutar.</p>
    </section>

    <input id="buscar" type="search" placeholder="Buscar una película...">

    <h2>Películas destacadas</h2>
    <section class="peliculas" id="lista">
      <article class="pelicula">
        <div class="poster">🎬</div>
        <h3>Viaje a las estrellas</h3>
        <p>Aventura y ciencia ficción</p>
      </article>
      <article class="pelicula">
        
 <div class="poster">
  <img
    https://image.tmdb.org/t/p/original/3aDWCRXLYOCuxjrjiPfLd79tcI6.jpg
    alt="Sonic 3: La película"
    style="width:100%; max-width:220px; height:auto; display:block; margin:auto;"
 
</div>
<h3>Sonic 3: La película</h3>
<p>Acción y aventura · 2024</p>              </article>
  <article class="pelicula">
  <div class="poster">🏜️</div>
  <h3>Mad Max: Furia en la carretera</h3>
  <p>Acción y aventura · 2015</p>
</article>

    </section>
  </main>

  <footer>© 2026 Movis Pel</footer>

  <script>
    document.getElementById('buscar').addEventListener('input', function() {
      const texto = this.value.toLowerCase();
      document.querySelectorAll('.pelicula').forEach(function(pelicula) {
        pelicula.style.display = pelicula.innerText.toLowerCase().includes(texto) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
